<!doctype html><html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>戸越銀座 設定ビューア</title>
<style>
:root{--bg:#f7f9fc;--card:#fff;--line:#e3e8f0;--head:#37474f;--sub:#546e7a;
      --ink:#223;--dim:#8892a0;
      --dw:44px;   /* 日付(列)の幅 */
      --rw:206px;  /* 機種名(左端の列)の幅 */
      --rh:28px}
*{box-sizing:border-box}
/* 端末がダークテーマでも地色が透けないよう、html にも明示的に塗る。
   配色をライト固定にしているのは、赤=全 / オレンジ=半 / カテゴリ色が
   Excel・PNG と同じ意味を持つ共通の記号だから (勝手に反転させない)。 */
html{background:#f7f9fc;color-scheme:light}
body{font-family:"Segoe UI","Yu Gothic UI","Hiragino Sans",sans-serif;margin:0;padding:16px;
     background:var(--bg);color:var(--ink);-webkit-text-size-adjust:100%}
h1{font-size:18px;margin:0 0 2px}
.lead{color:var(--dim);font-size:12px;margin-bottom:12px;line-height:1.5}

/* ---- 操作パネル ---- */
.panel{background:var(--card);border:1px solid var(--line);border-radius:9px;
       padding:11px 13px;margin-bottom:12px}
.row{display:flex;gap:13px;align-items:center;flex-wrap:wrap}
.row+.row{margin-top:9px;padding-top:9px;border-top:1px dashed var(--line)}
.fld{display:flex;gap:6px;align-items:center}
.lbl{font-size:10px;color:var(--dim);font-weight:700;letter-spacing:.04em;white-space:nowrap}
select,input[type=text]{font:inherit;font-size:13px;padding:5px 8px;
     border:1px solid #ccd4e0;border-radius:6px;background:#fff;color:var(--ink);max-width:100%}
.tog{display:inline-flex;gap:5px;align-items:center;font-size:12px;cursor:pointer;
     white-space:nowrap}
.tog input{width:16px;height:16px}
#custom{display:none}
#custom.on{display:flex}

/* ---- カテゴリの切り替え (セグメント) ----
   以前はカードを並べていたが「押せる」と気づかれなかった。
   枠で囲って、選択中を塗りつぶす“セグメントコントロール”の形にする。 */
.seg{display:flex;gap:0;overflow-x:auto;-webkit-overflow-scrolling:touch;
     border:1px solid #ccd4e0;border-radius:8px;background:#eef2f7;padding:3px;flex:1 1 auto}
.seg button{flex:0 0 auto;background:transparent;border:0;border-radius:6px;
     padding:5px 11px;cursor:pointer;font:inherit;color:#5b6673;text-align:center;
     white-space:nowrap;position:relative}
.seg button:hover{background:#e2e8f0}
.seg button .sn{font-size:11px;font-weight:700;display:block}
.seg button .sv{font-size:10px;color:var(--dim);display:block;margin-top:1px}
.seg button.on{background:var(--head);color:#fff;box-shadow:0 1px 4px rgba(40,60,80,.3)}
.seg button.on .sv{color:#c7d2dc}
.seg button::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;
     border-radius:3px 3px 0 0;background:var(--c,transparent)}

/* ---- 表 ---- */
h2{font-size:14px;margin:18px 0 7px;border-left:4px solid #4a7;padding-left:8px}
h2 .cnt{font-size:11px;color:var(--dim);font-weight:400}
.wrap{overflow:auto;max-height:78vh;background:var(--card);
      border:1px solid var(--line);border-radius:9px;-webkit-overflow-scrolling:touch}
table{border-collapse:separate;border-spacing:0;font-size:11px}
th,td{border-right:1px solid #eef1f6;border-bottom:1px solid #eef1f6;
      padding:2px 4px;text-align:center;white-space:nowrap}
thead th{position:sticky;background:var(--head);color:#fff;z-index:2}
thead tr:first-child th{top:0}
.off{color:#b0bec5}
.cfix{color:#cfd8dc}
.cvar{color:#ffca28;font-weight:700;cursor:help}
td{cursor:pointer;height:var(--rh)}
td.zen{background:#c62828;color:#fff;font-weight:700}
td.han{background:#ef8a3c;color:#fff;font-weight:700}
td.none{background:#fff}
td.na{background:#eceff1;cursor:default}

/* ---- 表: 行=機種 / 列=日付 ---- */
th.rh{position:sticky;left:0;z-index:3;background:var(--card);color:var(--ink);
      text-align:left;width:var(--rw);min-width:var(--rw);max-width:var(--rw);
      padding:3px 6px 3px 9px;border-left:4px solid var(--c,#ccc);font-weight:400;
      overflow:hidden}
thead th.rh{background:var(--head);color:#fff;z-index:4;font-weight:700;
            border-left-color:var(--head)}
th.rh .mn{font-size:11px;font-weight:700;overflow:hidden;text-overflow:ellipsis;
          white-space:nowrap;line-height:1.35}
th.rh .ms{font-size:9px;color:var(--dim);line-height:1.3;overflow:hidden;
          text-overflow:ellipsis;white-space:nowrap}
th.dc{width:var(--dw);min-width:var(--dw);font-size:10px;line-height:1.25;padding:3px 2px}
th.dc .w{font-size:9px;opacity:.75;display:block}
th.dc .nt{color:#ffca28;font-size:9px;cursor:help}
td.chgL{border-left:2px solid #ff9800}
tbody tr:hover th.rh{background:#f2f6fb}

.legend{display:flex;gap:12px;align-items:center;font-size:11px;flex-wrap:wrap;
        color:var(--dim);line-height:1.6}
.sw{display:inline-block;padding:1px 9px;border-radius:3px;font-weight:700;color:#fff}
.empty{padding:30px;text-align:center;color:var(--dim);font-size:13px}

/* ---- 台別内訳のモーダル ---- */
#ov{position:fixed;inset:0;background:rgba(20,28,40,.55);display:none;z-index:50;
    align-items:center;justify-content:center;padding:16px}
#ov.on{display:flex}
#dlg{background:#fff;border-radius:11px;max-width:640px;width:100%;
     max-height:86vh;overflow:auto;box-shadow:0 18px 50px rgba(0,0,0,.3)}
#dlg .dh{padding:13px 17px;border-bottom:1px solid var(--line);position:sticky;top:0;
         background:#fff;z-index:1}
#dlg .dt{font-size:15px;font-weight:700;padding-right:26px}
#dlg .ds{font-size:11px;color:var(--dim);margin-top:3px;line-height:1.6}
#dlg .db{padding:12px 17px 18px}
#dlg table{width:100%;font-size:12px;min-width:430px}   /* 9列。狭い画面では横スクロール */
#dlg th{background:var(--sub);color:#fff;position:static}
#dlg td{cursor:default;height:auto}
#x{float:right;cursor:pointer;font-size:24px;color:#aab;line-height:1;padding:0 6px;
   margin:-4px -6px 0 0}
#x:hover{color:#556}

/* ---- スマホ ---- */
@media (max-width:760px){
  :root{--dw:40px;--rw:132px}   /* --dw は収まるなら詰まるよう JS が上書きする */
  body{padding:10px}
  h1{font-size:16px}
  .lead{font-size:11px;margin-bottom:10px}
  .panel{padding:9px 10px}
  .row{gap:9px}
  /* iOS は font-size が 16px 未満の入力欄にフォーカスすると勝手に拡大する */
  select,input[type=text]{font-size:16px;padding:6px 8px}
  .fld{flex:1 1 auto;min-width:0}
  .fld select,.fld input{flex:1 1 auto;min-width:0}
  .seg{width:100%}
  .seg button{padding:5px 9px}
  .wrap{max-height:74vh}
  th.rh{padding:3px 4px 3px 7px}
  /* 幅が狭いので、機種名は「…」で切らずに2行まで折り返す。
     スマホでは title のツールチップが出ないため、切ると読む手段が無くなる。 */
  th.rh .mn{font-size:10px;white-space:normal;display:-webkit-box;
            -webkit-line-clamp:2;-webkit-box-orient:vertical;line-height:1.25}
  .legend{font-size:10px;gap:9px}
  #dlg .db{padding:10px 12px 16px}
  #dlg table{font-size:11px}
  #dlg th,#dlg td{padding:3px 2px}
}
</style></head><body>

const WD = "月火水木金土日";
const BAND = {"ジャグラー":"#ffe0b2","ノーマル系":"#c8e6c9","メダル機バラエティ":"#b3e5fc",
              "スマスロバラエティ":"#e1bee7","AT機":"#78909c"};
const esc = s => String(s).replace(/[&<>"]/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const wd = d => { const [y,m,dd]=d.split("-").map(Number);
                  return WD[(new Date(y,m-1,dd).getDay()+6)%7]; };
const md = d => { const p=d.split("-"); return +p[1]+"/"+ +p[2]; };
const mean = a => a.length ? a.reduce((x,y)=>x+y,0)/a.length : null;

function rateColor(v){
  if (v == null) return "#bbb";
  if (v >= 115) return "#b71c1c";
  if (v >= 108) return "#e53935";
  if (v >= 103) return "#ef6c00";
  if (v >= 98)  return "#555";
  return "#1565c0";
}

const ALL = "すべて";
// 表は 縦=機種 / 横=日付 に固定。期間を入替ごとに区切れば日付の数が少ないので、
// この向きなら機種名を横書きのまま読めてスマホでも扱いやすい。
// (縦=日付 の形が要るときは PNG か settings_report.html を見る)
const S = {tab:ALL, d0:D.days[0], d1:D.days[D.days.length-1],
           sort:"picked", q:"", showCnt:true, onlyPicked:false};
const range = () => D.days.filter(d => d >= S.d0 && d <= S.d1);

/** 絞り込んだ期間での機種ごとの集計。並び替えも見出しの数字もこれを使う。 */
function agg(m, days){
  const on=[], off=[]; let picked=0, cmax=0;
  for (const d of days){
    const c = m.cnt[d];
    if (c === undefined) continue;          // その日は未設置
    cmax = Math.max(cmax, c);
    const hit = m.ans[d] !== undefined;
    if (hit) picked++;
    const p = m.perf[d];
    if (p) (hit ? on : off).push(p[1]);
  }
  const a = mean(on), b = mean(off);
  return {picked, on:a, off:b, diff:(a!=null&&b!=null)?a-b:null, cmax};
}

/** 期間内の台数の変遷。全期間ぶんを持っているが、表示は絞った期間で作り直す。 */
function counts(m, days){
  const seq=[], chg={}; let prev=null;
  for (const d of days){
    const c = m.cnt[d];
    if (c === undefined) continue;
    if (c !== prev){ seq.push(c); if (prev !== null) chg[d]=c; prev=c; }
  }
  return {seq, chg};
}

/** その日その機種のカテゴリ。m.g は [[変わった日, カテゴリ], ...]。 */
function groupAt(m, d){
  let g = m.g[0][1];
  for (const [dd, gg] of m.g){
    if (dd <= d) g = gg; else break;
  }
  return g;
}

/** **選んだ期間の中で**その機種をどのカテゴリに置くか。
    台数が変わるとカテゴリも変わる (1台=バラエティ / 複数台=AT機 等) が、
    変化は新台入替の日に起きるので、期間を入替ごとに区切れば期間内では一定になる。
    期間を跨いで選んだときだけ多数決になる。 */
function homeGroup(m, days){
  if (m.g.length === 1) return m.g[0][1];
  const c = {};
  for (const d of days){
    if (m.cnt[d] === undefined) continue;
    const g = groupAt(m, d);
    c[g] = (c[g] || 0) + 1;
  }
  const ks = Object.keys(c);
  return ks.length ? ks.reduce((a, b) => c[a] >= c[b] ? a : b)
                   : m.g[m.g.length - 1][1];
}

/** 選んだ期間の中でカテゴリが変わったか (変わっていれば [旧, 新]) */
function groupSwitch(m, days){
  if (m.g.length === 1) return null;
  const seen = [];
  for (const d of days){
    if (m.cnt[d] === undefined) continue;
    const g = groupAt(m, d);
    if (!seen.length || seen[seen.length - 1] !== g) seen.push(g);
  }
  return seen.length > 1 ? seen : null;
}

/** RB確率(または合成)が設定いくつ相当かを返す。スペックのある機種だけ。 */
function nearSetting(name, kind, v){
  const sp = D.specs[name];
  if (!sp || v == null) return null;
  let best = null, bd = Infinity;
  for (const k of Object.keys(sp)){
    const d = Math.abs(sp[k][kind] - v);
    if (d < bd){ bd = d; best = +k; }
  }
  return best;
}

/** 設定の目安 → 色。高いほど濃い赤、低いほど青。 */
function setColor(s){
  return s == null ? "#8892a0"
    : s >= 6 ? "#b71c1c" : s === 5 ? "#d32f2f" : s === 4 ? "#ef6c00"
    : s === 3 ? "#8d6e63" : s === 2 ? "#607d8b" : "#1565c0";
}

/** カテゴリ全体の 対象日 vs 非対象日 の出率差。カテゴリ切り替えの数字に使う。 */
function groupStat(g, days){
  const on=[], off=[];
  for (const m of D.models){
    if (homeGroup(m, days) !== g) continue;
    for (const d of days){
      const p = m.perf[d];
      if (!p || m.cnt[d] === undefined) continue;
      (m.ans[d] !== undefined ? on : off).push(p[1]);
    }
  }
  const a = mean(on), b = mean(off);
  return {on:a, off:b, diff:(a!=null&&b!=null)?a-b:null};
}

function renderSeg(days){
  let html = `<button class="${S.tab===ALL?"on":""}" data-g="${ALL}"
      title="全カテゴリを続けて並べる"><span class="sn">すべて</span>
      <span class="sv">${D.models.length}機種</span></button>`;
  for (const g of D.groups){
    const cnt = D.models.filter(m => homeGroup(m, days) === g).length;
    if (!cnt) continue;
    const st = groupStat(g, days);
    html += `<button class="${g===S.tab?"on":""}" data-g="${esc(g)}"
      style="--c:${BAND[g]}"
      title="${esc(g)} ${cnt}機種 / 対象日 ${st.on!=null?st.on.toFixed(1):"-"}% ・ 非対象日 ${
        st.off!=null?st.off.toFixed(1):"-"}%">
      <span class="sn">${esc(g)}</span>
      <span class="sv">${st.diff!=null?(st.diff>=0?"+":"")+st.diff.toFixed(1)+"pt":"-"}</span></button>`;
  }
  document.getElementById("seg").innerHTML = html;
  document.querySelectorAll("#seg button").forEach(b => b.onclick = () => {
    S.tab = b.dataset.g; render(); });
}

/** 機種ごとの見出しに出す小さい数字 (台数 / 採用回数 / 対象・非対象の出率) */
function statLine(o){

    + (a.on != null ? `<span style="color:${rateColor(a.on)}">${a.on.toFixed(0)}%</span>` : "-")
    + (a.off != null ? ` <span class="off">${a.off.toFixed(0)}%</span>` : "");
}

  const rsn = (D.reasons[d] || {})[m.n];
  const tip = `${m.n} / ${d} / 設置${m.cnt[d]}台`
    + (v && m.raw[d] && m.raw[d] !== v ? ` / ${m.raw[d]}` : "")
    + (p ? ` / 出率${p[1].toFixed(1)}% / 平均差枚${p[2] > 0 ? "+" : ""}${p[2].toLocaleString()}` : "")
    + (rsn ? ` / 理由: ${rsn}` : "")
    + (D.notes[d] ? ` / 備考: ${D.notes[d]}` : "");
  return `<td class="${cls}" title="${esc(tip)}"${style} data-m="${esc(m.n)}" data-d="${d}">`
    + (p ? p[1].toFixed(0) : "") + "</td>";
}

/** 向き B: 縦=機種 / 横=日付。機種名が横書きで読める。 */
function tableByModel(g, ms, days){
  // 期間を入替ごとに区切ると日数が6日程度になる。あと十数pxで画面に収まる、
  // という場面が多いので、少しはみ出すだけなら日付の列幅を詰めて収める。
  // (大きくはみ出す全期間表示などは、素直に横スクロールさせる)
  const mob = innerWidth <= 760;
  const avail = (document.getElementById("out").clientWidth || innerWidth) - 2;
  const rw = mob ? 132 : 206;
  let dw = mob ? 40 : 44;
  const need = rw + days.length * dw;
  if (need > avail && need <= avail * 1.4)
    dw = Math.max(30, Math.floor((avail - rw) / days.length));

  const head = days.map(d => {
    const nt = D.notes[d];
    return `<th class="dc">${md(d)}${nt?`<span class="nt" title="${esc(nt)}">※</span>`:""}`
         + `<span class="w">${wd(d)}</span></th>`;
  }).join("");
  const rows = ms.map(o => {
    // 選んだ期間の中でカテゴリが変わった機種は、名前の後ろに印を付けて
    // 「今どちらに置いてあるか」が分かるようにする
    const sw = groupSwitch(o.m, days);
    const mark = sw ? ` <span style="color:#ff9800;cursor:help"
        title="${esc("期間中に " + sw.join(" → ") + " へ変わりました (台数が変わったため)")}"
        >⇄</span>` : "";
    return `<tr><th class="rh" style="--c:${BAND[g]}" title="${esc(o.m.n)}">
       <div class="mn">${esc(o.m.n)}${mark}</div><div class="ms">${statLine(o)}</div></th>`
    + days.map(d => cell(o, d, "chgL")).join("") + "</tr>";
  }).join("");
  // 左上のセルは、下の行と同じ 2段組み (.mn / .ms) にする。
  // 1行に流すと 206px の枠からはみ出す (th は nowrap なので折り返さない)。
  return `<div class="wrap" style="--dw:${dw}px"><table><thead>
    <tr><th class="rh"><div class="mn">機種</div>
      <div class="ms">${S.showCnt?"台数/":""}採用/対象・非対象</div></th>${head}</tr>
    </thead><tbody>${rows}</tbody></table></div>`;
}

function render(){
  const days = range();
  document.getElementById("dn").textContent = days.length + "日";
  renderSeg(days);

  const q = S.q.trim();
  const shown = D.models.filter(m => (!q || m.n.includes(q)));
  const groups = S.tab === ALL ? D.groups : [S.tab];

  let html = "";
  for (const g of groups){
    let ms = shown.filter(m => homeGroup(m, days) === g)
                  .map(m => ({m, a:agg(m, days), c:counts(m, days)}))
                  .filter(o => o.a.cmax > 0)                  // 期間中に未設置なら出さない
                  .filter(o => !S.onlyPicked || o.a.picked > 0);
    if (!ms.length) continue;
    const key = S.sort;
    ms.sort((x,y) => {
      if (key === "name") return x.m.n.localeCompare(y.m.n, "ja");
      const val = (o, k) => k === "picked" ? o.a.picked : k === "count" ? o.a.cmax : o.a[k];
      const xv = val(x, key), yv = val(y, key);
      if (xv == null && yv == null) return x.m.n.localeCompare(y.m.n, "ja");
      if (xv == null) return 1;
      if (yv == null) return -1;
      return yv - xv || x.m.n.localeCompare(y.m.n, "ja");
    });
    html += `<h2>${esc(g)} <span class="cnt">${ms.length}機種</span></h2>`
         + tableByModel(g, ms, days);
  }
  document.getElementById("out").innerHTML =
    html || '<div class="empty">条件に合う機種がありません。期間・カテゴリ・検索語を見直してください。</div>';
}

// ---- 台別内訳 ----
function openUnits(name, day){
  const m = D.models.find(x => x.n === name);
  const us = (D.units[name] || {})[day] || [];
  document.getElementById("dt").textContent = name;
  const v = m.ans[day], p = m.perf[day];
  const rawv = m.raw && m.raw[day];
  const rsn = (D.reasons[day] || {})[name];
  const dayEv = (D.reasons[day] || {})[""];
  document.getElementById("ds").innerHTML =
    `${day}(${wd(day)}) / 設置${m.cnt[day] ?? "-"}台 / 判定 ` +
    (v ? `<b style="color:${v==="全"?"#c62828":"#ef8a3c"}">${rawv && rawv !== v ? rawv : v}</b>` : "対象外") +
    (rsn ? ` / 理由: <b>${esc(rsn)}</b>` : "") +
    (dayEv ? ` / この日: ${esc(dayEv)}` : "") +
    (p ? ` / 機種平均 出率${p[1].toFixed(1)}% 差枚${p[2]>0?"+":""}${p[2].toLocaleString()}` : "") +
    (D.notes[day] ? `<br>備考: ${esc(D.notes[day])}` : "");

  let body;
  if (!us.length){
    body = '<div class="empty">この日の台別データがありません。' +
           'みんレポ/papimo の取得待ちか、その日は未設置です。</div>';
  } else {
    // みんレポは台別の差枚を「プラスの台だけ」公開している。マイナス台は "-" になる。
    // つまり差枚が空 = 欠測ではなく **負け台** (972/972 日×機種で検算済み)。
    // G数はほぼ全台入っているので、G数だけで出率を出すと必ず 100% になる罠がある。
    // 出率は差枚とG数が両方揃った台だけで計算する。
    // 差枚が公開されているのは**プラスの台だけ**。0 も公開されるが勝ちではない。
    const known = us.filter(u => u[2] != null);
    const wins  = known.filter(u => u[2] > 0);
    const minus = us.length - known.length;
    const plusTot = known.reduce((s,u) => s + u[2], 0);

    // マイナス分は 機種平均差枚 × 台数 − プラス分の合計 で逆算する。
    // **表示の平均差枚は使わない。** みんレポはマイナス側を丸めている
    // (-100〜-249 は50枚刻み、-250以下は250枚刻み、0に向かう切り捨て)。
    // 代わりに p[2] = 出率から復元した真の平均 (誤差 ±14枚以内) を使う。
    // 台数と行数が一致するときだけ (欠けた行があると計算が狂うため)。
    const n = us.length;
    const ok = p && m.cnt[day] === n && minus;
    const trueAvg = p ? p[2] : null;
    const est = ok ? trueAvg * n - plusTot : null;
    // 誤差: 出率は0.1%刻み → 平均で ±0.0005×G×3 ≒ 数枚。台数ぶん積んでも±14×n 程度
    const err = ok ? Math.ceil(14 * n / minus) : 0;         // マイナス1台あたりの不確かさ
    const rounded = p && p[0] !== trueAvg;                   // 表示値が丸められていた日か

    const rows = us.map(u => {
      const [num, gm, sa, bb, rb, tot] = u;
      const rate = (gm > 0 && sa != null) ? (gm * 3 + sa) / (gm * 3) * 100 : null;
      // ボーナス確率の母数は **papimoの総スタート**。BB/RB も papimo 由来なので、
      // みんレポの G数 で割ると数字が狂う (293台中167台が3%以上ズレる)
      const pr = (cnt) => (cnt && tot) ? tot / cnt : null;
      const bbP = pr(bb), rbP = pr(rb), allP = pr((bb || 0) + (rb || 0));
      const st = nearSetting(name, "rb", rbP);
      const f = (v) => v == null ? "-" : "1/" + Math.round(v);
      return `<tr><td><b>${num ?? "-"}</b></td>
        <td>${gm != null ? gm.toLocaleString() : "-"}</td>
        <td style="color:${sa == null ? "#1565c0" : "#c62828"}">${
          sa != null ? "+" + sa.toLocaleString() : "マイナス"}</td>
        <td style="color:${sa == null ? "#1565c0" : rateColor(rate)};font-weight:700">${
          rate != null ? rate.toFixed(1) + "%" : (sa == null ? "100%未満" : "-")}</td>
        <td>${bb ?? "-"}</td><td>${rb ?? "-"}</td>
        <td>${f(bbP)}</td>
        <td style="color:${setColor(st)};font-weight:700">${f(rbP)}${
          st ? `<span style="font-weight:400;font-size:9px"> 設定${st}</span>` : ""}</td>
        <td>${f(allP)}</td></tr>`;
    }).join("");

    const hasBB = us.some(u => u[3] != null);
    const fmt = v => (v > 0 ? "+" : "") + Math.round(v).toLocaleString();
    let minusLine = "";
    if (minus){
      minusLine = `<br><span style="color:#1565c0">マイナス${minus}台</span>
         (みんレポは<b>プラスの台しか差枚を公開しない</b>ので個別の値は出ない)`;
      if (est != null){
        minusLine += ` — 合計 <b style="color:#1565c0">${fmt(est)}</b>
          、1台あたり約 <b style="color:#1565c0">${fmt(est / minus)}</b>
          <span style="opacity:.8">(±${err}枚)</span>
          <br><span style="opacity:.8">機種平均 ${fmt(trueAvg)} × ${n}台 から逆算`
          + (rounded ? `。みんレポの表示は ${fmt(p[0])} だが、これはマイナスを丸めた値。
             出率 ${p[1].toFixed(1)}% から丸める前の平均を復元して使っている` : "")
          + `</span>`;
      }
    }
    body = `<div style="font-size:11px;color:var(--dim);margin-bottom:7px;line-height:1.7">` +
      `勝ち台 <b>${wins.length}/${n}台</b>` +
      (known.length - wins.length ? ` (差枚0が${known.length - wins.length}台)` : "") +
      (wins.length ? ` / プラス分の合計 <b style="color:#c62828">+${plusTot.toLocaleString()}</b>` : "") +
      minusLine +
      (hasBB ? "" : `<br>BB/RB は papimo 取得開始日 (2026-08-13) 以降のみ入ります`) +
      `</div>
      <div style="overflow-x:auto">
      <table><thead><tr><th>台番</th><th>G数</th><th>差枚</th><th>出率</th>
      <th>BB</th><th>RB</th><th>BB確率</th><th>RB確率</th><th>合成</th></tr></thead>
      <tbody>${rows}</tbody></table></div>` +
      (D.specs[name] ? `<div style="font-size:10px;color:var(--dim);margin-top:7px;
        line-height:1.6">RB確率の下の「設定N」は、スペック表で一番近い設定。
        1日の数字はブレるので目安。<br>` +
        Object.keys(D.specs[name]).map(k =>
          `設定${k} 1/${D.specs[name][k].rb.toFixed(0)}`).join(" ・ ") + `</div>` : "");
  }
  document.getElementById("db").innerHTML = body;
  document.getElementById("ov").classList.add("on");
}

// ---- 期間 ----
// 全期間 / 新台入替ごとの期間 / 直近N日 / 自分で指定。
// 入替期間は make_input_excel.py と同じ区切り (変動10台以上) なのでExcelのシートと一致する。
const PRESETS = [{v:"all", t:`全期間 (${D.days.length}日)`, from:D.days[0],
                  to:D.days[D.days.length-1]}];
D.eras.forEach((e, i) => PRESETS.push({
  v:"era"+i, t:`入替期間 ${e.label} (${e.n}日)${e.latest?" ←最新":""}`, from:e.from, to:e.to}));
[7, 14].forEach(n => {
  if (D.days.length > n) PRESETS.push({v:"last"+n, t:`直近${n}日`,
    from:D.days[D.days.length-n], to:D.days[D.days.length-1]});
});
PRESETS.push({v:"custom", t:"自分で指定…"});

const psel = document.getElementById("preset");
psel.innerHTML = PRESETS.map(p => `<option value="${p.v}">${esc(p.t)}</option>`).join("");
const dsel = (id, val) => {
  const el = document.getElementById(id);
  el.innerHTML = D.days.map(d => `<option value="${d}">${d}(${wd(d)})</option>`).join("");
  el.value = val;
  return el;
};
const e0 = dsel("d0", S.d0), e1 = dsel("d1", S.d1);

// 開いたときは **最新の入替区間** を選んでおく。
// 今のラインナップでの傾向がいちばん知りたいことなので、全期間より使いでがある。
// (入替がまだ1回も無ければ全期間)
const FIRST = D.eras.length ? "era0" : "all";
psel.value = FIRST;
{
  const p = PRESETS.find(x => x.v === FIRST);
  S.d0 = e0.value = p.from;
  S.d1 = e1.value = p.to;
}

psel.onchange = () => {
  const p = PRESETS.find(x => x.v === psel.value);
  document.getElementById("custom").classList.toggle("on", p.v === "custom");
  if (p.from){ S.d0 = e0.value = p.from; S.d1 = e1.value = p.to; }
  render();
};
const toCustom = () => { psel.value = "custom";
  document.getElementById("custom").classList.add("on"); };
e0.onchange = () => { S.d0 = e0.value; if (S.d0 > S.d1){ S.d1 = S.d0; e1.value = S.d1; }
                      toCustom(); render(); };
e1.onchange = () => { S.d1 = e1.value; if (S.d1 < S.d0){ S.d0 = S.d1; e0.value = S.d0; }
                      toCustom(); render(); };

document.getElementById("sort").onchange = e => { S.sort = e.target.value; render(); };
document.getElementById("q").oninput = e => { S.q = e.target.value; render(); };
document.getElementById("showCnt").onchange = e => { S.showCnt = e.target.checked; render(); };
document.getElementById("onlyPicked").onchange = e => { S.onlyPicked = e.target.checked; render(); };

document.addEventListener("click", e => {
  const td = e.target.closest("td[data-m]");
  if (td) openUnits(td.dataset.m, td.dataset.d);
});
const close = () => document.getElementById("ov").classList.remove("on");
document.getElementById("x").onclick = close;
document.getElementById("ov").onclick = e => { if (e.target.id === "ov") close(); };
document.addEventListener("keydown", e => { if (e.key === "Escape") close(); });

// 縦書きの見出しは画面幅で高さを変えているので、回転やウィンドウ変更で作り直す
let rt = null, lastMob = innerWidth <= 760;
addEventListener("resize", () => {
  const mob = innerWidth <= 760;
  if (mob === lastMob) return;
  lastMob = mob;
  clearTimeout(rt);
  rt = setTimeout(render, 150);
});

document.getElementById("lead").textContent =
  `${D.hall}   ${D.days[0]} 〜 ${D.days[D.days.length-1]} (${D.days.length}日) / ` +
  `期間中に設置されていた ${D.models.length} 機種。セルの数字はその日の出率(%)。`;
render();
</script></body></html>
